# The whole system on one machine: Kafka, the databases, every service, the screens and
# two tools to look inside. Section 2 of docs/03-implementation-plan.md explains the layout.
#
#   docker compose up -d --wait        start everything (first time: builds the backend image)
#   docker compose exec tools pytest   backend tests (tiers 1 and 2) against test-db
#   bin/chaos offline pos01            cut a branch off Kafka (see bin/chaos for the rest)
#   docker compose down                stop everything
#
# Screens: http://localhost:5173   Kafka UI: http://localhost:8080   Adminer: http://localhost:8081
# Services: inventory-1 8101, inventory-2 8102, kitchen 8201, pos01 8301, pos02 8302,
#           online 8303, query 8401 (each serves /health and /docs)
#
# Networks follow the paths data takes, so that one path can be cut without the others:
#   kafka-net        brokers and every service that produces or consumes
#   <service>-net    one service and its own database
#   replication-net  the branch DBs, the central DB and the Order Query Service
#   api-net          the screens and every service's HTTP API
# The database passwords are for this local setup only.
name: order-system

x-kafka: &kafka
  image: apache/kafka:4.3.2
  restart: unless-stopped
  networks: [kafka-net]
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/19092' || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 30

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # 01 section 13.1 and 03 section 2: three replicas everywhere, internal topics included.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-postgres: &postgres
  image: postgres:16.14
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U app -d $${POSTGRES_DB}"]
    interval: 3s
    timeout: 3s
    retries: 30

x-postgres-branch-command: &postgres-branch-command
  # Branch DBs publish orders to the Central Order Replica (02 section 5).
  ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]

x-backend: &backend
  # Built once by the tools service below; every other backend container reuses it.
  image: order-system-backend:local
  pull_policy: never
  volumes: ["./backend:/app"]

x-service: &service
  <<: *backend
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 5s

x-service-env: &service-env
  KAFKA_BOOTSTRAP: kafka1:19092,kafka2:19092,kafka3:19092
  RELOAD: "1"

services:
  # ---------- Kafka ----------
  kafka1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092
  kafka2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19092
  kafka3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19092
  kafka-init:
    # Creates the topics with the settings of 01 section 13.1, then exits.
    <<: *backend
    command: ["python", "scripts/create_topics.py"]
    environment: *service-env
    networks: [kafka-net]
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }

  # ---------- Databases ----------
  inventory-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: inventory }
    networks: [inventory-net]
  kitchen-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: kitchen }
    networks: [kitchen-net]
  pos01-db:
    <<: *postgres
    command: *postgres-branch-command
    environment: { <<: *postgres-env, POSTGRES_DB: branch }
    networks: [pos01-net, replication-net]
  pos02-db:
    <<: *postgres
    command: *postgres-branch-command
    environment: { <<: *postgres-env, POSTGRES_DB: branch }
    networks: [pos02-net, replication-net]
  online-db:
    <<: *postgres
    command: *postgres-branch-command
    environment: { <<: *postgres-env, POSTGRES_DB: branch }
    networks: [online-net, replication-net]
  central-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: central }
    networks: [replication-net]
  test-db:
    # Only for the tests; data in memory, a new database per test.
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: postgres }
    tmpfs: [/var/lib/postgresql/data]
    networks: [test-net]

  # ---------- Services (one image, told apart by SERVICE) ----------
  inventory-1:
    <<: *service
    ports: ["8101:8000"]
    environment:
      <<: *service-env
      SERVICE: inventory
      DATABASE_URL: postgresql://app:app@inventory-db:5432/inventory
    networks:
      kafka-net: {}
      inventory-net: {}
      api-net: { aliases: [inventory] }
    depends_on: &inventory-deps
      inventory-db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
  inventory-2:
    <<: *service
    ports: ["8102:8000"]
    environment:
      <<: *service-env
      SERVICE: inventory
      DATABASE_URL: postgresql://app:app@inventory-db:5432/inventory
    networks:
      kafka-net: {}
      inventory-net: {}
      api-net: { aliases: [inventory] }
    depends_on: *inventory-deps
  kitchen:
    <<: *service
    ports: ["8201:8000"]
    environment:
      <<: *service-env
      SERVICE: kitchen
      DATABASE_URL: postgresql://app:app@kitchen-db:5432/kitchen
    networks: [kafka-net, kitchen-net, api-net]
    depends_on:
      kitchen-db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
  pos01:
    <<: *service
    ports: ["8301:8000"]
    environment:
      <<: *service-env
      SERVICE: branch
      BRANCH_ID: POS01
      DATABASE_URL: postgresql://app:app@pos01-db:5432/branch
    networks: [kafka-net, pos01-net, api-net]
    depends_on:
      pos01-db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
  pos02:
    <<: *service
    ports: ["8302:8000"]
    environment:
      <<: *service-env
      SERVICE: branch
      BRANCH_ID: POS02
      DATABASE_URL: postgresql://app:app@pos02-db:5432/branch
    networks: [kafka-net, pos02-net, api-net]
    depends_on:
      pos02-db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
  online:
    <<: *service
    ports: ["8303:8000"]
    environment:
      <<: *service-env
      SERVICE: branch
      BRANCH_ID: ONLINE
      DATABASE_URL: postgresql://app:app@online-db:5432/branch
    networks: [kafka-net, online-net, api-net]
    depends_on:
      online-db: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
  query:
    <<: *service
    ports: ["8401:8000"]
    environment:
      <<: *service-env
      SERVICE: query
      DATABASE_URL: postgresql://app:app@central-db:5432/central
    networks: [replication-net, api-net]
    depends_on:
      central-db: { condition: service_healthy }
  replication-init:
    # Publication at each branch DB, one subscription per branch at central-db, then exits.
    <<: *backend
    command: ["python", "scripts/setup_replication.py"]
    environment:
      CENTRAL_DSN: host=central-db dbname=central user=app password=app
      BRANCH_DBS: POS01=pos01-db,POS02=pos02-db,ONLINE=online-db
    networks: [replication-net]
    depends_on:
      pos01: { condition: service_healthy }
      pos02: { condition: service_healthy }
      online: { condition: service_healthy }
      query: { condition: service_healthy }

  # ---------- Screens ----------
  frontend:
    image: node:24.22.1-bookworm-slim
    restart: unless-stopped
    init: true
    working_dir: /app
    # Installs the locked packages when the node_modules volume is empty, then serves Vite.
    command:
      - sh
      - -c
      - "[ -x node_modules/.bin/vite ] || npm ci --no-audit --no-fund; exec npm run dev"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - npm-cache:/root/.npm
    networks: [api-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s

  # ---------- Looking inside ----------
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: order-system
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092,kafka2:19092,kafka3:19092
      JAVA_OPTS: -Xms128m -Xmx256m
    networks: [kafka-net]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
  adminer:
    # Log in with server = the DB container name (inventory-db, pos01-db…), user/password app.
    image: adminer:6.1.2
    restart: unless-stopped
    ports: ["8081:8080"]
    networks: [inventory-net, kitchen-net, pos01-net, pos02-net, online-net, replication-net]

  # ---------- Tools ----------
  tools:
    # Tests, lint and type checks: docker compose exec tools <command>, from backend/.
    <<: *backend
    build: ./backend
    command: ["sleep", "infinity"]
    init: true
    environment:
      <<: *service-env
      TEST_DATABASE_URL: postgresql://app:app@test-db:5432/postgres
    networks:
      [kafka-net, inventory-net, kitchen-net, pos01-net, pos02-net, online-net, replication-net, test-net]
    depends_on:
      test-db: { condition: service_healthy }

networks:
  kafka-net:
  inventory-net:
  kitchen-net:
  pos01-net:
  pos02-net:
  online-net:
  replication-net:
  api-net:
  test-net:

volumes:
  frontend-node-modules:
  npm-cache:
