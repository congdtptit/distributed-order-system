# Two jobs: the TypeScript screens in frontend/ (Biome, tsc, Vitest), and the
# Python services (formatting, lint, type check, tier 1 and 2 tests).
# The tier 3 tests (real Kafka, fault injection) are slow and run in the
# nightly workflow instead (section 5.6 of docs/03-implementation-plan.md).
# Locally the same commands run in compose: docker compose exec tools ...,
# docker compose exec frontend npx ...
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked dependencies
        run: npm ci
      - name: Formatting and lint
        run: npx --no-install biome ci .
      - name: Type check
        run: npx --no-install tsc --noEmit
      - name: Tests
        run: npx --no-install vitest run

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # The same PostgreSQL as test-db in docker-compose.yml; each test creates its own database.
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.12"
          working-directory: backend
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync pyright
      - name: Tier 1 and 2 tests
        run: uv run --no-sync pytest -m "not tier3"
