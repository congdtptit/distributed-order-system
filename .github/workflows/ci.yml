# Three jobs: the TypeScript screens in frontend/ (Biome, tsc, Vitest); the
# Python services (formatting, lint, type check, tier 1 and 2 tests); and the
# demo setup itself (docker compose --profile full, every /health, replication).
# The tier 3 tests (real Kafka, fault injection) are slow and run in the
# nightly workflow instead (section 5.6 of docs/03-implementation-plan.md).
# Locally the same commands run in compose: docker compose exec tools ...,
# docker compose exec frontend npx ...
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked dependencies
        run: npm ci
      - name: Formatting and lint
        run: npx --no-install biome ci .
      - name: Type check
        run: npx --no-install tsc --noEmit
      - name: Tests
        run: npx --no-install vitest run

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # The same PostgreSQL as test-db in docker-compose.yml; each test creates its own database.
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.12"
          working-directory: backend
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync pyright
      - name: Tier 1 and 2 tests
        run: uv run --no-sync pytest -m "not tier3"

  # In place of continuous deployment (section 5.6 of docs/03-implementation-plan.md): the
  # demo runs on one machine with Docker Compose, so check that the full setup still starts,
  # every service answers and every branch replicates to the Central Order Replica.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend image
        run: docker compose --profile full build
      - name: Start everything
        run: docker compose --profile full up -d --wait --wait-timeout 600
      - name: Every service answers /health
        run: |
          for port in 8101 8102 8201 8301 8302 8303 8401; do
            curl -fsS --retry 10 --retry-all-errors --retry-delay 3 "http://localhost:$port/health"
            echo
          done
          curl -fsS --retry 20 --retry-all-errors --retry-delay 3 -o /dev/null http://localhost:5173/
      - name: Every branch replicates to the Central Order Replica
        run: |
          for i in $(seq 1 30); do
            fresh=$(curl -fsS http://localhost:8401/reports/summary |
              jq '[.branches[] | select(.data_age_s != null and .data_age_s < 15)] | length')
            [ "$fresh" = 3 ] && echo "3 branches replicate" && exit 0
            sleep 2
          done
          curl -fsS http://localhost:8401/reports/summary | jq .
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose --profile full logs --tail 200
