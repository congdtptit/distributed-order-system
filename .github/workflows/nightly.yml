# The tier 3 tests on the full compose cluster: real Kafka, replication and fault injection
# through the Docker socket (section 3 of docs/03-implementation-plan.md). They are slow and can
# be flaky, so they run once a night and on manual start instead of blocking a pull request.
# Locally: docker compose --profile full up -d --wait, then
#          docker compose exec tools pytest -m tier3
name: nightly

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 in Vietnam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend image
        run: docker compose --profile full build
      - name: Start everything
        run: docker compose --profile full up -d --wait --wait-timeout 600
      - name: Tier 3 tests
        run: >-
          docker compose exec -T tools
          pytest -m tier3 -rf -p no:cacheprovider --junitxml=/report/generated/junit-tier3.xml
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-tier3
          path: report/generated/junit-tier3.xml
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose --profile full logs --tail 300
