[project]
name = "query-service"
version = "0.1.0"
description = "Order Query Service: Management reporting from the Central Order Replica"
requires-python = "==3.12.*"
dependencies = [
  "common",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.14"]
build-backend = "uv_build"
