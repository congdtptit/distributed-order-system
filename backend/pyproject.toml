# uv workspace of the Python services (section 2 of docs/03-implementation-plan.md).
# Commands run in the tools container of docker-compose.yml, from this directory:
#   docker compose exec tools pytest
[project]
name = "order-system-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "common",
  "order-service",
  "inventory-service",
  "kitchen-service",
  "query-service",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "pyright[nodejs]>=1.1.390",
  "httpx2>=2.16.0",
]

[tool.uv]
package = false
# Resolve only releases at least two weeks old; move this date forward on purpose.
exclude-newer = "2026-11-07T00:00:00Z"

[tool.uv.workspace]
members = ["common", "order-service", "inventory-service", "kitchen-service", "query-service"]

[tool.uv.sources]
common = { workspace = true }
order-service = { workspace = true }
inventory-service = { workspace = true }
kitchen-service = { workspace = true }
query-service = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["common", "order_service", "inventory_service", "kitchen_service", "query_service"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
  "common",
  "order-service",
  "inventory-service",
  "kitchen-service",
  "query-service",
  "scripts",
  "conftest.py",
]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv"]
# Resolve the workspace packages to their source, not to the editable install.
extraPaths = [
  "common/src",
  "order-service/src",
  "inventory-service/src",
  "kitchen-service/src",
  "query-service/src",
  # Shared test helpers of a module (e.g. inventory_support.py); see pytest pythonpath below.
  "inventory-service/tests",
  "kitchen-service/tests",
  "order-service/tests",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]
# Test helper modules shared by the test files of one module; their names are unique.
pythonpath = ["inventory-service/tests", "kitchen-service/tests", "order-service/tests"]
# xunit1 keeps the kb(<n>) properties that scripts/report_tests.py reads.
junit_family = "xunit1"
testpaths = [
  "common/tests",
  "order-service/tests",
  "inventory-service/tests",
  "kitchen-service/tests",
  "query-service/tests",
]
markers = [
  "kb(n): the scenario number in section 12 of docs/01-business-spec.md that this test covers",
  "tier3: needs a real Kafka, container stops or replication; slow, excluded from ci (run with -m tier3)",
]
