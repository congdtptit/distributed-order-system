# Local infrastructure and development containers.
#
#   docker compose -f infra/compose.yaml up -d --wait   Kafka and the six databases
#   ./bin/backend <command>                                 run a command in backend-dev (Python, uv), from backend/
#   ./bin/frontend <command>                                 run a command in frontend-dev (Node), from frontend/
#
# Section 13 of docs/01-business-spec.md sets the Kafka settings; section 2 of
# docs/03-implementation-plan.md lists the parts. The service containers come in step 7.
# The database passwords are for this local setup only.
name: order-system

x-kafka: &kafka
  image: apache/kafka:4.3.2
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/19092' || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 30

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # 01 section 13.1 and 03 section 2: three replicas everywhere, internal topics included.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-postgres: &postgres
  image: postgres:16.14
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U app -d $${POSTGRES_DB}"]
    interval: 3s
    timeout: 3s
    retries: 30

x-postgres-branch-command: &postgres-branch-command
  # Branch DBs publish orders to the Central Order Replica (02 section 5).
  ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]

services:
  kafka1:
    <<: *kafka
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://localhost:9092
  kafka2:
    <<: *kafka
    ports: ["9094:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19092,EXTERNAL://localhost:9094
  kafka3:
    <<: *kafka
    ports: ["9096:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19092,EXTERNAL://localhost:9096

  inventory-db:
    <<: *postgres
    ports: ["5433:5432"]
    environment: { <<: *postgres-env, POSTGRES_DB: inventory }
  kitchen-db:
    <<: *postgres
    ports: ["5434:5432"]
    environment: { <<: *postgres-env, POSTGRES_DB: kitchen }
  pos01-db:
    <<: *postgres
    ports: ["5435:5432"]
    command: *postgres-branch-command
    environment: { <<: *postgres-env, POSTGRES_DB: branch }
  pos02-db:
    <<: *postgres
    ports: ["5436:5432"]
    command: *postgres-branch-command
    environment: { <<: *postgres-env, POSTGRES_DB: branch }
  online-db:
    <<: *postgres
    ports: ["5437:5432"]
    command: *postgres-branch-command
    environment: { <<: *postgres-env, POSTGRES_DB: branch }
  central-db:
    <<: *postgres
    ports: ["5438:5432"]
    environment: { <<: *postgres-env, POSTGRES_DB: central }

  # Development containers (profile dev). bin/backend and bin/frontend start them when needed.
  backend-dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
    image: order-system-backend-dev:local
    profiles: [dev]
    init: true
    volumes:
      - ..:/workspace
      - backend-venv:/opt/venv
      - uv-cache:/root/.cache/uv
      # Testcontainers starts PostgreSQL and Kafka next to this container.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      KAFKA_BOOTSTRAP: kafka1:19092,kafka2:19092,kafka3:19092
    extra_hosts: ["host.docker.internal:host-gateway"]

  frontend-dev:
    image: node:24.22.1-bookworm-slim
    profiles: [dev]
    init: true
    working_dir: /workspace/frontend
    # Serves the screens at http://localhost:5173 with the Vite dev server. Installs the
    # locked packages first when the node_modules volume is empty. bin/frontend runs the
    # other commands (tests, type check, Biome) inside this same container.
    command:
      - sh
      - -c
      - "[ -x node_modules/.bin/vite ] || npm ci --no-audit --no-fund; exec npm run dev"
    ports: ["5173:5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s
    volumes:
      - ..:/workspace
      - frontend-node-modules:/workspace/frontend/node_modules
      - npm-cache:/root/.npm

volumes:
  backend-venv:
  uv-cache:
  frontend-node-modules:
  npm-cache:
